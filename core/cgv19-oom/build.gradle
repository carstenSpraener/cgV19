plugins {
    id 'java-library'
}

dependencies {
    implementation project(":cgv19-core")
    implementation 'org.apache.groovy:groovy:4.0.12'

    testImplementation 'junit:junit:4.13.1'
    testImplementation group: 'com.google.code.gson', name: 'gson', version: '2.8.5'
    testImplementation 'org.mockito:mockito-all:1.10.18'
}

apply plugin: 'jacoco'

test {
    finalizedBy jacocoTestReport
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'CLASS'
            includes = [
                'de.spraener.nxtgen.oom.model.MPackage',
                'de.spraener.nxtgen.oom.model.OOModel',
                'de.spraener.nxtgen.oom.model.MAttribute',
                'de.spraener.nxtgen.oom.model.MClass',
                'de.spraener.nxtgen.oom.model.MOperation',
                'de.spraener.nxtgen.oom.model.MParameter',
                'de.spraener.nxtgen.oom.model.MReference',
                'de.spraener.nxtgen.oom.model.MAssociation',
                'de.spraener.nxtgen.oom.model.MActivity'
            ]
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}
